# Prompt wording resources; review translations with native speakers before formal reporting.
languages:
  eng:
    name: English
    base: "Reply in English, stay relevant and natural, and respond appropriately to the user's needs."
    zero_shot: "Use a {emotion} emotional tone. Keep the response accurate and appropriate."
    descriptive: "Convey {description} through natural wording and emotional expression appropriate to the situation. Do not repeat emotion labels mechanically or exaggerate facts."
  chn:
    name: Chinese
    base: "请使用中文回复，保持内容相关、自然，并根据用户的实际需求作出恰当回应。"
    zero_shot: "请使用{emotion}的情绪语气，同时确保回复准确、自然且恰当。"
    descriptive: "请通过符合该情绪的自然措辞和适度表达来传达{description}。不要机械重复情绪词，也不要夸大事实。"
  esp:
    name: Spanish
    base: "Responde en español, mantén la respuesta pertinente y natural, y atiende adecuadamente las necesidades del usuario."
    zero_shot: "Usa un tono emocional de {emotion}, manteniendo una respuesta precisa y apropiada."
    descriptive: "Transmite {description} con expresiones naturales y adecuadas a la situación. No repitas mecánicamente etiquetas emocionales ni exageres los hechos."
  deu:
    name: German
    base: "Antworte auf Deutsch, bleibe relevant und natürlich und gehe angemessen auf die Bedürfnisse der Person ein."
    zero_shot: "Antworte in einem Ton, der {emotion} vermittelt, und bleibe dabei sachlich und angemessen."
    descriptive: "Vermittle {description} durch natürliche, situationsgerechte Formulierungen. Wiederhole keine Gefühlswörter mechanisch und übertreibe keine Tatsachen."
  hin:
    name: Hindi
    base: "हिंदी में उत्तर दें। उत्तर प्रासंगिक और स्वाभाविक रखें तथा उपयोगकर्ता की ज़रूरतों के अनुसार उचित प्रतिक्रिया दें।"
    zero_shot: "सटीक और उचित रहते हुए {emotion} भाव में उत्तर दें।"
    descriptive: "स्थिति के अनुरूप स्वाभाविक शब्दों और उचित भाव-प्रदर्शन से {description} व्यक्त करें। भावना के शब्दों को यांत्रिक रूप से न दोहराएँ और तथ्यों को बढ़ा-चढ़ाकर न कहें।"
  mar:
    name: Marathi
    base: "मराठीत उत्तर द्या. उत्तर संबंधित आणि नैसर्गिक ठेवा व वापरकर्त्याच्या गरजेनुसार योग्य प्रतिसाद द्या."
    zero_shot: "अचूकता आणि योग्यपणा राखून {emotion} भावनेत उत्तर द्या."
    descriptive: "परिस्थितीला साजेशा नैसर्गिक शब्दांत आणि योग्य भावनेने {description} व्यक्त करा. भावनेचे शब्द यांत्रिकपणे पुन्हा वापरू नका किंवा तथ्यांचा अतिशयोक्ती करू नका."
  rus:
    name: Russian
    base: "Отвечай по-русски, сохраняй уместность и естественность и учитывай потребности пользователя."
    zero_shot: "Отвечай с {emotion} эмоциональной окраской, сохраняя точность и уместность."
    descriptive: "Передавай {description} естественными и уместными для ситуации формулировками. Не повторяй названия эмоций механически и не преувеличивай факты."
  tat:
    name: Tatar
    base: "Татарча җавап бир. Җавапны темага туры китер, табигый яз һәм кулланучының ихтыяҗларына урынлы җавап бир."
    zero_shot: "Төгәллекне һәм урынлылыкны саклап, {emotion} хис белән җавап бир."
    descriptive: "{description} халәтен табигый һәм вазгыятькә туры килгән сүзләр белән җиткер. Хис исемнәрен механик кабатлама һәм фактларны арттырма."
  ron:
    name: Romanian
    base: "Răspunde în română, păstrează răspunsul relevant și natural și ține cont de nevoile utilizatorului."
    zero_shot: "Răspunde cu un ton {emotion}, păstrând acuratețea și adecvarea."
    descriptive: "Transmite {description} prin formulări naturale și potrivite situației. Nu repeta mecanic etichete emoționale și nu exagera faptele."
  hau:
    name: Hausa
    base: "Amsa da Hausa, ka kasance mai dacewa da yanayi da kuma dabi'a, sannan ka kula da bukatun mai amfani."
    zero_shot: "Yi amfani da yanayin magana mai {emotion}, tare da kiyaye daidaito da dacewa."
    descriptive: "Isar da {description} ta kalmomi na dabi'a da suka dace da yanayin. Kada a maimaita sunayen motsin rai ko a yi karin gishiri kan gaskiya."
